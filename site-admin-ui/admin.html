<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة إدارة TRUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2238;--navy-2:#16324F;--gold:#C9A15A;--gold-2:#D9B46E;--gold-ink:#7A5716;--line:#E2E7ED;--bg:#F3F5F8;--ink:#14202e;--ink-2:#5B6878;--ok:#1F7A4D;--ok-bg:#E4F3EB;--bad:#b4372f;--bad-bg:#fbeceb;--warn-bg:#F6EBD3}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit}textarea.inp{resize:vertical}
.hidden{display:none!important}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:18px;letter-spacing:.5px}.brand small{color:var(--gold-2);font-size:13px}
.mark{width:34px;height:34px;border-radius:8px;background:#fff;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:7px}
.mark i{width:5px;background:var(--navy);border-radius:2px}.mark i:nth-child(1){height:45%}.mark i:nth-child(2){height:100%;background:var(--gold)}.mark i:nth-child(3){height:70%}
.hdr-r{display:flex;gap:10px;align-items:center;font-size:13px;color:#C9D3DF}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--navy)}.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-bad{background:#fff;border-color:var(--bad);color:var(--bad)}.btn-sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn-ghost{background:transparent;border-color:rgba(217,180,110,.6);color:var(--gold-2)}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;min-width:20px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;margin-inline-start:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi span{color:var(--ink-2);font-size:13px}.kpi b{display:block;font-size:26px;color:var(--navy);margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 12px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--line);padding:8px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--bg);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--gold-ink)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.navy{background:var(--navy);color:#fff}
.muted{color:var(--ink-2);font-size:13px}
.meter{height:6px;background:#e8edf3;border-radius:6px;overflow:hidden;width:110px;margin-top:4px}.meter i{display:block;height:100%;background:var(--navy-2)}.meter.hot i{background:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.search{width:100%;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.empty{color:var(--ink-2);text-align:center;padding:24px}
.login{max-width:380px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.login h1{font-size:20px;color:var(--navy);margin:0 0 4px}
label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px}
.note{background:var(--warn-bg);color:var(--gold-ink);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(14,34,56,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.pane{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:10px;z-index:30;font-size:14px}
.scroll{overflow-x:auto}
@media (max-width:700px){main{padding:16px 10px}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"><i></i><i></i><i></i></span><div><b>TRUST</b><br><small>لوحة الإدارة: الاشتراكات والموافقات</small></div></div>
  <div class="hdr-r"><span id="who"></span><a class="btn btn-ghost btn-sm" href="/">الوكيل ←</a><button class="btn btn-ghost btn-sm hidden" id="outBtn">خروج</button></div>
</header>

<div id="loginBox" class="login hidden">
  <h1>دخول مدير TRUST</h1>
  <div class="muted">هذه الصفحة لمدير TRUST فقط.</div>
  <form id="loginForm">
    <label>البريد الإلكتروني</label><input class="inp" id="lEmail" type="email" autocomplete="username" required>
    <label>كلمة المرور</label><input class="inp" id="lPass" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">دخول</button>
  </form>
  <div id="lErr" class="err hidden"></div>
</div>

<div id="denied" class="login hidden"><h1>غير مخوّل</h1><p class="muted">هذا الحساب ليس حساب مدير TRUST.</p><button class="btn" id="out2">تسجيل الخروج</button></div>

<main id="app" class="hidden">
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="sum">الملخص</button>
    <button class="tab" data-t="pend">طلبات الموافقة<span class="badge hidden" id="pCount"></span></button>
    <button class="tab" data-t="users">المشتركون</button>
    <button class="tab" data-t="plans">الباقات والأسعار</button>
    <button class="tab" data-t="bl">القائمة السوداء</button>
    <button class="tab" data-t="audit">سجل العمليات</button>
    <button class="tab hidden" data-t="site" id="siteTab">إدارة الموقع</button>
    <button class="btn btn-sm" id="reload" style="margin-inline-start:auto">↻ تحديث</button>
  </div>
  <section id="t-sum"></section>
  <section id="t-pend" class="hidden"></section>
  <section id="t-users" class="hidden"></section>
  <section id="t-plans" class="hidden"></section>
  <section id="t-bl" class="hidden"></section>
  <section id="t-audit" class="hidden"></section>
  <section id="t-site" class="hidden"></section>
</main>

<div id="modal" class="modal hidden"><div class="pane" id="pane"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient("https://jbeiipdxcyzdqarxzbyo.supabase.co", "sb_publishable_1-BaxouaNpq6UhJuWoSMBw_6UF-FWQI");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const d = (t) => t ? new Date(t).toLocaleDateString("en-GB", { timeZone: "Asia/Jerusalem" }) : "—";
const money = (n) => "$" + (Math.round(Number(n || 0) * 100) / 100).toLocaleString("en-US");
const PLAN = { free: "مجاني", basic: "أساسي", pro: "مهني", credit: "ائتمان ومؤسسات" };
const SVC = { smart_cfo: "المدير المالي الذكي", credit_analysis: "التحليل الائتماني", invoice_journal: "محوّل الفواتير", analysis: "أداة التحليل المالي والائتماني" };
const BILL = { monthly: "شهري", yearly: "سنوي", manual: "يدوي (بدون دفع)", trial: "تجربة" };
const ACTIONS = { plan_grant: "منح/تعديل باقة", plan_revoke_test: "إلغاء باقة تجريبية", tool_access_approved: "موافقة على وصول أداة", tool_access_rejected: "رفض وصول أداة", entitlement_updated: "تعديل صلاحية أداة", plan_update: "تعديل سعر باقة",
  account_suspended: "إيقاف مؤقت", account_resumed: "إعادة تفعيل بعد إيقاف مؤقت", account_terminated: "إيقاف نهائي", account_unbanned: "رفع الإيقاف النهائي",
  blacklist_add: "إضافة إلى القائمة السوداء", blacklist_remove: "إزالة من القائمة السوداء" };
const MSG_SUSP = "اشتراكك موقوف مؤقتاً. للاستفسار تواصل مع TRUST على واتساب 0599371188.";
const MSG_TERM = "تم إنهاء اشتراكك في خدمات TRUST. للاستفسار تواصل مع TRUST على واتساب 0599371188.";
let UF = "all";
let D = null;

function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function closeModal() { $("modal").classList.add("hidden"); }
$("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
function errText(e) { const m = (e && (e.message || e.msg)) || String(e); if (/admin_required/.test(m)) return "غير مخوّل."; if (/invalid_plan/.test(m)) return "باقة غير صحيحة.";
  const map = { already_restricted: "هذا الحساب موقوف أصلاً.", cannot_restrict_admin: "لا يمكن إيقاف حساب مدير.", invalid_until: "تاريخ العودة يجب أن يكون في المستقبل.",
    message_required: "اكتب رسالة العميل.", invalid_email: "البريد غير صحيح.", not_suspended: "هذا الحساب غير موقوف مؤقتاً.", user_not_found: "الحساب غير موجود." };
  for (const k in map) if (m.includes(k)) return map[k];
  return m; }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("loginBox").classList.remove("hidden"); return; }
  const { data: isAdm } = await sb.rpc("analysis_is_admin");
  $("who").textContent = session.user.email;
  $("outBtn").classList.remove("hidden");
  if (isAdm !== true) { $("denied").classList.remove("hidden"); return; }
  $("app").classList.remove("hidden");
  await loadPerms();
  await load();
}
$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("lErr").classList.add("hidden");
  const { error } = await sb.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value });
  if (error) { $("lErr").textContent = /Invalid login/i.test(error.message) ? "البريد أو كلمة المرور غير صحيحة." : error.message; $("lErr").classList.remove("hidden"); return; }
  $("loginBox").classList.add("hidden"); boot();
};
const signOut = async () => { await sb.auth.signOut(); location.reload(); };
$("outBtn").onclick = signOut; $("out2").onclick = signOut;
$("reload").onclick = () => load(true);
$("tabs").onclick = (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  ["sum", "pend", "users", "plans", "bl", "audit", "site"].forEach((t) => $("t-" + t).classList.toggle("hidden", t !== b.dataset.t));
  if (b.dataset.t === "site") loadSite();
};

async function load(msg) {
  const { data, error } = await sb.rpc("trust_admin_dashboard");
  if (error) { $("t-sum").innerHTML = `<div class="err">${esc(errText(error))}</div>`; return; }
  D = data; renderSum(); renderPend(); renderUsers(); renderPlans(); renderBl(); renderAudit();
  if (msg) toast("تم التحديث");
}

function renderSum() {
  const s = D.summary, pa = s.paid_active || {};
  const paid = Object.values(pa).reduce((a, b) => a + b, 0);
  $("pCount").textContent = s.pending; $("pCount").classList.toggle("hidden", !s.pending);
  $("t-sum").innerHTML = `
  <div class="grid">
    <div class="kpi"><span>طلبات بانتظار موافقتك</span><b style="color:${s.pending ? "var(--bad)" : "var(--navy)"}">${s.pending}</b></div>
    <div class="kpi"><span>المشتركون بباقات مدفوعة</span><b>${paid}</b><div class="muted">${Object.entries(pa).map(([k, v]) => PLAN[k] + ": " + v).join(" · ") || "—"}</div></div>
    <div class="kpi"><span>الإيراد الشهري المتوقع</span><b>${money(s.mrr_usd)}</b><div class="muted">لا يشمل الباقات اليدوية</div></div>
    <div class="kpi"><span>تكلفة الذكاء الاصطناعي هذا الشهر</span><b>${money(s.ai_cost_month_usd)}</b></div>
    <div class="kpi"><span>اشتراكات تنتهي خلال 7 أيام</span><b>${s.expiring_7d}</b></div>
    <div class="kpi"><span>حسابات موقوفة</span><b>${(s.suspended || 0) + (s.terminated || 0)}</b><div class="muted">مؤقت: ${s.suspended || 0} · نهائي: ${s.terminated || 0}</div></div>
    <div class="kpi"><span>إجمالي الحسابات</span><b>${s.users_total}</b><div class="muted">جديد هذا الشهر: ${s.users_new_month}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>كيف يعمل التفعيل</h2>
  <div class="muted">١) العميل يطلب الاشتراك عبر واتساب ويدفع بتحويل بنكي أو محفظة. ٢) من «المشتركون» ابحث عن بريده واضغط «منح باقة». ٣) الباقة تفعّل الوكيل والأدوات المشمولة فيها تلقائياً بنفس تاريخ الانتهاء. ٤) للتجديد اضغط «تجديد» فيُمدَّد الاشتراك شهراً أو سنة من تاريخ انتهائه.</div></div>`;
}

function renderPend() {
  const p = D.pending || [];
  $("t-pend").innerHTML = `<div class="card"><h2>طلبات بانتظار الموافقة</h2>${!p.length ? `<div class="empty">لا توجد طلبات معلّقة ✓</div>` : `<div class="scroll"><table>
  <tr><th>العميل</th><th>الطلب</th><th>التاريخ</th><th></th></tr>
  ${p.map((r, i) => `<tr><td><b>${esc(r.full_name || "—")}</b><div class="muted">${esc(r.email)}</div></td>
  <td>${r.kind === "tool_access" ? "طلب استخدام" : "طلب تفعيل"}: ${esc(SVC[r.service] || r.service)}</td><td>${d(r.requested_at)}</td>
  <td><div class="acts"><button class="btn btn-ok btn-sm" data-ap="${i}">موافقة (تجربة)</button><button class="btn btn-sm" data-gp="${esc(r.user_id)}">منح باقة</button><button class="btn btn-bad btn-sm" data-rj="${i}">رفض</button></div></td></tr>`).join("")}
  </table></div><div class="note">«موافقة (تجربة)» تسمح للعميل بالدخول واستخدام التجربة المجانية للأداة. للاستخدام الكامل امنحه باقة بعد الدفع.</div>`}</div>`;
  $("t-pend").querySelectorAll("[data-ap],[data-rj]").forEach((b) => b.onclick = async () => {
    const r = p[Number(b.dataset.ap ?? b.dataset.rj)]; const ok = b.dataset.ap !== undefined;
    if (!ok && !confirm("رفض طلب " + r.email + "؟")) return;
    b.disabled = true;
    const { error } = await sb.rpc("trust_admin_access_decide", { p_user_id: r.user_id, p_service: r.service, p_approve: ok });
    if (error) { toast(errText(error)); b.disabled = false; return; }
    toast(ok ? "تمت الموافقة" : "تم الرفض"); load();
  });
  $("t-pend").querySelectorAll("[data-gp]").forEach((b) => b.onclick = () => openGrant(b.dataset.gp));
}

const DAY = 864e5;
function uStatus(u) {
  if (u.is_admin) return "admin";
  if (u.banned || (u.restriction && u.restriction.kind === "terminated")) return "term";
  if (u.restriction && u.restriction.kind === "suspended") return "susp";
  const p = u.plan;
  if (p && p.code !== "free") {
    const exp = p.expires_at ? new Date(p.expires_at) : null;
    if (p.status !== "active" || (exp && exp <= new Date())) return "expired";
    if (exp && exp - new Date() <= 7 * DAY) return "soon";
    return "active";
  }
  return "free";
}
const ST = { admin: ["مدير", "navy"], term: ["موقوف نهائياً", "bad"], susp: ["موقوف مؤقتاً", "warn"], expired: ["منتهٍ", "bad"], soon: ["ينتهي قريباً", "warn"], active: ["فعّال", "ok"], free: ["مجاني", ""] };
const FILTERS = [["all", "الكل"], ["active", "فعّال"], ["soon", "ينتهي قريباً"], ["expired", "منتهٍ"], ["stopped", "موقوف"], ["free", "مجاني"], ["cost", "الأعلى تكلفة"]];
function inFilter(s) {
  if (UF === "all" || UF === "cost") return true;
  if (UF === "active") return s === "active" || s === "soon";
  if (UF === "stopped") return s === "susp" || s === "term";
  return s === UF;
}
function planCell(u, st) {
  const p = u.plan;
  if (st === "admin") return `<span class="pill navy">مدير</span>`;
  let h = p && p.code !== "free" ? `<b>${esc(PLAN[p.code] || p.code)}</b> <span class="muted">${esc(BILL[p.billing] || p.billing || "")}${p.launch_discount ? " · خصم إطلاق" : ""}</span>` : `<span class="muted">مجاني</span>`;
  h += `<div><span class="pill ${ST[st][1]}">${ST[st][0]}</span></div>`;
  const r = u.restriction;
  if (r) h += `<div class="muted">منذ ${d(r.since)}${r.until ? " · يعود تلقائياً " + d(r.until) : ""}${r.note ? "<br>ملاحظة: " + esc(r.note) : ""}</div>`;
  else if (u.banned) h += `<div class="muted">الحساب مغلق</div>`;
  if (u.blacklisted) h += `<div><span class="pill bad">في القائمة السوداء</span></div>`;
  return h;
}
function expCell(u) {
  const p = u.plan;
  if (!p || p.code === "free" || !p.expires_at) return `<span class="muted">—</span>`;
  const days = Math.ceil((new Date(p.expires_at) - new Date()) / DAY);
  const tag = days > 7 ? `<span class="muted">باقي ${days} يوم</span>` : days > 0 ? `<span class="pill warn">باقي ${days} يوم</span>` : `<span class="pill bad">انتهى منذ ${-days} يوم</span>`;
  return `<b>${d(p.expires_at)}</b><div>${tag}</div>`;
}
const m3 = (n) => { n = Number(n || 0); return n > 0 && n < 1 ? "$" + n.toFixed(3) : money(n); };
function econCell(u) {
  const e = u.econ || {}, c = Number(e.cost_period_usd || 0), r = Number(e.revenue_period_usd || 0);
  let h = `<b>${m3(c)}</b> <span class="muted">تكلفة هذه الفترة</span>`;
  if (r > 0) {
    const pc = c / r * 100;
    h += `<div class="muted">المدفوع ${money(r)} · <span class="pill ${pc > 30 ? "bad" : "ok"}">${pc < 0.1 && c > 0 ? "&lt;0.1" : pc.toFixed(1)}%</span></div><div class="muted">الهامش <b style="color:${r - c < 0 ? "var(--bad)" : "var(--ok)"}">${money(r - c)}</b></div>`;
  } else if (u.is_admin) h += `<div class="muted">حساب المدير</div>`;
  else if (e.billing === "manual" && u.effective_plan !== "free") h += `<div class="muted">باقة يدوية بدون دفع</div>`;
  else h += `<div class="muted">بدون إيراد${c > 0 ? ` <span class="pill warn">يكلّف</span>` : ""}</div>`;

  $("siteTab").classList.toggle("hidden", !(PERM.content_edit || PERM.content_publish || PERM.pricing_manage));
}
function siteErr(e) { const m = (e && (e.message || e.msg)) || String(e); for (const k in SITE_ERR) if (m.includes(k)) return SITE_ERR[k]; return errText(e); }
const pick = (o, k, dflt = "") => (o && o[k] != null && o[k] !== "") ? o[k] : dflt;

async function loadSite() {
  if (!PERM.content_edit && !PERM.pricing_manage) { $("t-site").innerHTML = `<div class="err">لا تملك صلاحية إدارة الموقع.</div>`; return; }
  $("t-site").innerHTML = `<div class="empty">جارٍ التحميل…</div>`;
  SITE = [];
  if (PERM.content_edit) {
    const { data, error } = await sb.rpc("site_admin_list", { p_kind: "tool" });
    if (error) { $("t-site").innerHTML = `<div class="err">${esc(siteErr(error))}</div>`; return; }
    SITE = data || [];
  }
  renderSite();
}

function renderSite() {
  const tools = PERM.content_edit ? `<div class="card"><h2>الأدوات الرقمية (${SITE.length})</h2>
    <div class="muted">تعديل المسودة لا يغيّر ما يراه الزوار. الزائر يرى النسخة المنشورة فقط، والنشر يتطلب صلاحية النشر.</div>
    ${!SITE.length ? `<div class="empty">لا توجد أدوات مسجّلة بعد.</div>` : `<div class="scroll" style="margin-top:10px"><table>
    <tr><th>الأداة</th><th>الحالة</th><th>المنشور</th><th>آخر تعديل</th><th></th></tr>
    ${SITE.map((it, i) => {
      const c = it.draft || {}, st = SITE_STATE[it.state] || ["", ""];
      const vErr = it.validation && it.validation.ok === false ? `<div class="pill bad">مسودة غير صالحة للنشر</div><div class="muted">${esc((it.validation.errors || []).join("، "))}</div>` : "";
      return `<tr><td><b>${esc(pick(c.ar, "name", it.key))}</b><div class="muted" dir="ltr" style="text-align:right">${esc(it.key)}</div></td>
      <td>${esc(TOOL_STATUS[c.status] || c.status || "—")}</td>
      <td><span class="pill ${st[1]}">${st[0]}</span>${it.published_version ? `<div class="muted">نسخة ${it.published_version} · ${d(it.published_at)}</div>` : ""}${vErr}</td>
      <td class="muted">${d(it.draft_updated_at)}<div>${esc(it.draft_updated_by || "")}</div></td>
      <td><div class="acts">
        <button class="btn btn-sm" data-se="${i}">تعديل المسودة</button>
        ${PERM.content_publish && it.state !== "published" && it.validation && it.validation.ok ? `<button class="btn btn-ok btn-sm" data-sp="${i}">نشر</button>` : ""}
        ${PERM.content_publish ? `<button class="btn btn-sm" data-sh="${i}">السجل والاستعادة</button>` : ""}
      </div></td></tr>`;
    }).join("")}</table></div>`}</div>` : "";
  const pricing = (PERM.pricing_manage || PERM.is_admin) ? `<div class="card"><h2>الأسعار</h2>
    <div class="muted">الأسعار المعروضة في الموقع تُقرأ من مصدر واحد. تعديلها هنا لا يغيّر الاشتراكات القائمة ولا صلاحيات الأدوات.</div>
    <div id="priceBox" style="margin-top:10px"><div class="empty">جارٍ التحميل…</div></div></div>` : "";
  $("t-site").innerHTML = tools + pricing;
  $("t-site").querySelectorAll("[data-se]").forEach((b) => b.onclick = () => openSiteEdit(SITE[Number(b.dataset.se)]));
  $("t-site").querySelectorAll("[data-sp]").forEach((b) => b.onclick = () => publishItem(SITE[Number(b.dataset.sp)]));
  $("t-site").querySelectorAll("[data-sh]").forEach((b) => b.onclick = () => openHistory(SITE[Number(b.dataset.sh)]));
  if (pricing) renderPricing();
}

function openSiteEdit(it) {
  const c = it.draft || {}, ar = c.ar || {}, en = c.en || {}, ln = c.links || {};
  const inp = (id, label, val, extra = "") => `<label>${label}</label><input class="inp" id="${id}" value="${esc(val)}" ${extra}>`;
  $("pane").innerHTML = `<h2>تعديل الأداة</h2><div class="muted" dir="ltr" style="text-align:right">${esc(it.key)}</div>
  ${inp("fArN", "الاسم (عربي)", ar.name)}
  <label>وصف قصير (عربي)</label><textarea class="inp" id="fArS" rows="2">${esc(ar.short)}</textarea>
  ${inp("fEnN", "Name (English)", en.name, 'dir="ltr"')}
  <label>Short description (English)</label><textarea class="inp" id="fEnS" rows="2" dir="ltr">${esc(en.short)}</textarea>
  <div class="row2"><div><label>الحالة</label><select class="inp" id="fSt">${Object.entries(TOOL_STATUS).map(([k, v]) => `<option value="${k}" ${c.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
  <div><label>الترتيب</label><input class="inp" type="number" id="fSo" value="${esc(pick(c, "sort_order", 0))}"></div></div>
  ${inp("fLn", "رابط «اعرف أكثر» (مسار داخلي أو trustfins.org)", ln.learn_more || "", 'dir="ltr"')}
  ${inp("fTr", "رابط «جرّب» (trustfins.org فقط)", ln.try || "", 'dir="ltr"')}
  ${inp("fLo", "رابط «تسجيل الدخول» (trustfins.org فقط)", ln.login || "", 'dir="ltr"')}
  <div class="note">الأسعار لا تُكتب هنا. الحفظ يحفظ مسودة فقط؛ النشر خطوة منفصلة.</div>
  <div class="acts" style="margin-top:14px"><button class="btn btn-primary" id="fOk">حفظ المسودة</button><button class="btn" onclick="closeModal()">إلغاء</button></div>
  <div id="fErr" class="err hidden"></div>`;
  $("fOk").onclick = async () => {
    const arName = $("fArN").value.trim(); if (!arName) return modalErr("fErr", "اكتب الاسم بالعربية.");
    const content = { ...c, slug: c.slug || it.key, status: $("fSt").value, sort_order: Number($("fSo").value || 0),
      ar: { ...ar, name: arName, short: $("fArS").value.trim() },
      en: { ...en, name: $("fEnN").value.trim(), short: $("fEnS").value.trim() },
      links: { ...ln, learn_more: $("fLn").value.trim() || null, try: $("fTr").value.trim() || null, login: $("fLo").value.trim() || null } };
    $("fOk").disabled = true;
    const { data, error } = await sb.rpc("site_save_draft", { p_kind: "tool", p_key: it.key, p_content: content });
    if (error) { modalErr("fErr", error); $("fOk").disabled = false; return; }
    closeModal();
    const v = data && data.validation;
    toast(v && v.ok === false ? "حُفظت المسودة. تحتاج تصحيحاً قبل النشر" : "حُفظت المسودة");
    loadSite();
  };
  $("modal").classList.remove("hidden");
}

async function publishItem(it) {
  if (!confirm(`نشر «${pick(it.draft && it.draft.ar, "name", it.key)}» للزوار؟ ستظهر النسخة الحالية من المسودة للجميع.`)) return;
  const { data, error } = await sb.rpc("site_publish", { p_item: it.id });
  if (error) return toast(siteErr(error));
  toast(data && data.unchanged ? "لا تغييرات جديدة للنشر" : `تم النشر: نسخة ${data.version}`);
  loadSite();
}

async function openHistory(it) {
  const { data, error } = await sb.rpc("site_history", { p_item: it.id });
  if (error) return toast(siteErr(error));
  const vers = (data && data.versions) || [], audit = (data && data.audit) || [];
  $("pane").innerHTML = `<h2>السجل والاستعادة</h2><div class="muted" dir="ltr" style="text-align:right">${esc(it.key)}</div>
  <h2 style="font-size:16px;margin-top:14px">النسخ المنشورة</h2>
  ${!vers.length ? `<div class="empty">لم يُنشر بعد.</div>` : `<table><tr><th>النسخة</th><th>التاريخ</th><th>بواسطة</th><th></th></tr>
  ${vers.map((v) => `<tr><td>${v.version}${v.restored_from ? ` <span class="muted">(استعادة من ${v.restored_from})</span>` : ""}</td><td class="muted">${d(v.published_at)}</td><td class="muted">${esc(v.published_by || "—")}</td>
  <td>${v.version === it.published_version ? `<span class="pill ok">الحالية</span>` : `<button class="btn btn-sm" data-rv="${v.version}">استعادة</button>`}</td></tr>`).join("")}</table>`}
  <h2 style="font-size:16px;margin-top:14px">سجل العمليات</h2>
  ${!audit.length ? `<div class="empty">لا عمليات</div>` : `<table>${audit.slice(0, 30).map((a) => `<tr><td class="muted">${new Date(a.at).toLocaleString("en-GB", { timeZone: "Asia/Jerusalem" })}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.actor || "—")}</td></tr>`).join("")}</table>`}
  <div class="acts" style="margin-top:14px"><button class="btn" onclick="closeModal()">إغلاق</button></div><div id="hErr" class="err hidden"></div>`;
  $("pane").querySelectorAll("[data-rv]").forEach((b) => b.onclick = async () => {
    if (!confirm(`استعادة النسخة ${b.dataset.rv}؟ تُنشر كنسخة جديدة، ولا يُحذف شيء من السجل.`)) return;
    const { error: e2 } = await sb.rpc("site_restore", { p_item: it.id, p_version: Number(b.dataset.rv) });
    if (e2) return modalErr("hErr", siteErr(e2));
    closeModal(); toast("تمت الاستعادة"); loadSite();
  });
  $("modal").classList.remove("hidden");
}

async function renderPricing() {
  const box = $("priceBox");
  const { data, error } = await sb.rpc("site_public_plans");
  if (error) { box.innerHTML = `<div class="err">${esc(siteErr(error))}</div>`; return; }
  box.innerHTML = `<div class="scroll"><table><tr><th>الباقة</th><th>شهري $</th><th>سنوي $</th><th></th></tr>
  ${(data || []).map((p) => `<tr><td><b>${esc(p.name_ar)}</b></td>
  <td><input class="inp" style="width:90px" type="number" step="0.01" id="spm-${p.code}" value="${p.price_usd_month}"></td>
  <td><input class="inp" style="width:90px" type="number" step="0.01" id="spy-${p.code}" value="${p.price_usd_year}"></td>
  <td><button class="btn btn-sm" data-spc="${p.code}" ${PERM.pricing_manage ? "" : "disabled"}>حفظ السعر</button></td></tr>`).join("")}</table></div>`;
  box.querySelectorAll("[data-spc]").forEach((b) => b.onclick = async () => {
    const c = b.dataset.spc, m = Number($("spm-" + c).value), y = Number($("spy-" + c).value);
    if (!(m > 0 && y > 0)) return toast("أدخل أسعاراً صحيحة");
    if (!confirm(`حفظ سعر «${PLAN[c] || c}»: $${m} شهرياً و$${y} سنوياً؟ الاشتراكات القائمة لا تتغير.`)) return;
    const { error: e2 } = await sb.rpc("site_pricing_update", { p_code: c, p_patch: { price_usd_month: m, price_usd_year: y } });
    if (e2) return toast(siteErr(e2));
    toast("تم حفظ السعر"); renderPricing();
  });
}

boot();
</script>
</body>
</html>
